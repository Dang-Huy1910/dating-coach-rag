[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dating-coach-rag"
version = "0.1.0"
description = "Personal AI dating coach chatbot (RAG + FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "numpy>=2.0",
  "faiss-cpu>=1.9",
  "groq>=0.13",
  "streamlit>=1.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]
embed = [
  "sentence-transformers>=3.1",
]

[project.scripts]
dating-coach-ingest = "backend.app.rag.ingest:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
